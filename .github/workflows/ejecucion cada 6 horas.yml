name: Monitoreo Caudales JVRM

on:
  schedule:
    - cron: '0 */6 * * *' # Ejecuta cada 6 horas
  workflow_dispatch: # Permite ejecución manual

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # OBLIGATORIO para permitir el push a GitHub

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 1. Se agregó matplotlib a la instalación
      - name: Instalar librerías
        run: pip install requests pandas matplotlib

      - name: Ejecutar script
        run: python "caudales_jvrm.py"

      # 2. Nuevo paso: Ejecutar el script que crea los gráficos y el README
      - name: Generar gráficos y README
        run: python "graficos_jvrm.py"

      # 3. Se cambió `git add caudales_jvrm.csv` a `git add .` para incluir imágenes y README
      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática de caudales y gráficos JVRM" && git push)
